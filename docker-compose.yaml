services:
  strands:
    build:
      context: .
      dockerfile: Dockerfile.supervisor
    ports:
      - "8000:8000"
    environment:
      - AGENT_NAME=strands
      - CONTAINER_URI=0.0.0.0:8000
      - ROLE_ARN=arn:aws:iam::123456789012:role/bedrock-agentcore-control
      - COGNITO_DISCOVERY_URL=https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_1234567890
      - COGNITO_CLIENT_ID=1234567890

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.agent_as_tool
    ports:
      - "8000:8000"
    environment:
      - AGENT_NAME=mcp
      - CONTAINER_URI=0.0.0.0:8000
      - ROLE_ARN=arn:aws:iam::123456789012:role/bedrock-agentcore-control
      - COGNITO_DISCOVERY_URL=https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_1234567890
      - COGNITO_CLIENT_ID=1234567890

  a2a:
    build:
      context: .
      dockerfile: Dockerfile.supervisor
    ports:
      - "8000:8000"
    environment:
      - AGENT_NAME=a2a
      - CONTAINER_URI=0.0.0.0:8000
      - ROLE_ARN=arn:aws:iam::123456789012:role/bedrock-agentcore-control
      - COGNITO_DISCOVERY_URL=https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_1234567890
      - COGNITO_CLIENT_ID=1234567890
    